# The one Rust every build uses: development, the register and the release
# (`docs/design/decisions.md`, "D104"). It moves only
# through `.claude/skills/upgrade-deps/SKILL.md`, since the shipped binary is
# the timed one only while one compiler builds both (`docs/design/decisions.md`,
# "D13").
#
# The targets are the ones a checkout builds beyond its own: the release's
# second, and the static one `peak-rss` and `count-instructions` are built
# for on an x86-64 host (`scripts/measure.py`, `peak_rss_target`).
# `rust-analyzer` is what `scripts/module_graph.py` reads the code's
# references with, the release of it this compiler ships.
[toolchain]
channel = "1.98.0"
profile = "minimal"
components = ["clippy", "rustfmt", "rust-analyzer"]
targets = ["aarch64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
