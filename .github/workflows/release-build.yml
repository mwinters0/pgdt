# The release build: a manually dispatched workflow that builds `pgdt` for
# x86-64 from one pushed commit, runs the suite on both architectures -- the
# round's, less the measurement apparatus (`docs/design/decisions.md`,
# "D110") -- and leaves a DRAFT Release of the x86-64 archive. The arm64
# archive is built from the same commit on the maintainer's machine, whose
# link a runner cannot hold, and attached to the draft there
# (`docs/design/decisions.md`, "D109").
# Publishing is `release-publish.yml`, run by the tag the maintainer pushes
# once the draft is whole (`scripts/release_ci.py`, "Build first, tag second").
#
# **The workflow holds no logic.** Every `run:` step is one line of `scripts/release.py`
# (the image, the builds, the notices, the suites) or `scripts/release_ci.py`
# (the preflight, the archive, the smoke run, the checksums, the draft), whose tests hold
# these lines to those scripts' own command lines
# (`scripts/test_release_ci.py`). The commit arrives as `INPUT_REF` in the
# environment, never interpolated into a shell line, and the scripts validate
# it. Every action is pinned by commit, and every job holds the permissions it
# uses and no more.
#
# Each build and each suite is a job of its own: a runner's disk is not sized
# for two workspace builds, and the jobs have no use for each other's.
name: release-build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: The full commit id to build, 40 hex characters; the draft is of this commit
        required: true
        type: string

permissions: {}

env:
  INPUT_REF: ${{ inputs.ref }}
  PGDT_RELEASE_CONTAINER: docker
  # A runner is the build's alone, so a run leaves no core free (`release.py`).
  PGDT_RELEASE_RESERVE_CORES: "0"

jobs:
  # Refuse before building: a ref that is not the commit, or a version a Release
  # already carries.
  preflight:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - run: python3 scripts/release_ci.py preflight
        env:
          GH_TOKEN: ${{ github.token }}

  x86-64-release:
    needs: preflight
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - run: python3 scripts/release.py image
      - run: python3 scripts/release.py build --release --target=x86_64-unknown-linux-gnu
      - run: python3 scripts/release.py notices --target=x86_64-unknown-linux-gnu
      - run: python3 scripts/release_ci.py archive --target=x86_64-unknown-linux-gnu
      - run: python3 scripts/release_ci.py smoke --target=x86_64-unknown-linux-gnu
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archive-x86_64-unknown-linux-gnu
          path: dist/*.tar.xz
          if-no-files-found: error
          compression-level: 0

  x86-64-suite:
    needs: preflight
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # The whole history, as the round's check has it: the suite resolves
      # the commits `measurements.md` declares. A build needs only the ref.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          fetch-depth: 0
      - run: python3 scripts/release.py image
      - run: python3 scripts/release.py suite

  # arm64 code runs on the arm64 runner: the suite, built and run in the arm64
  # image of the same Dockerfile, needing nothing of another job; the shipped
  # arm64 archive runs on one too, from the draft, in `release-publish.yml`.
  # Rejected: the test binaries cross-built and passed
  # between jobs, gigabytes every release would upload and download; qemu-user
  # on an x86-64 runner, which would run the tests under that host's `/proc`,
  # cgroups and page size and without arm's memory ordering, the very things
  # the runtime-discovery and allocator tests read.
  arm64-suite:
    needs: preflight
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          fetch-depth: 0
      - run: python3 scripts/release.py image
      - run: python3 scripts/release.py suite

  # Only a build that passed everything is drafted. The archive is attested
  # here, from the commit, before any tag exists: a failed suite leaves no
  # attestation for an archive that ships nowhere, and the signing permissions
  # sit in the one job that runs no dependency code, the build jobs running
  # every build script. The attestation names this job's run as its builder,
  # the bytes being the build job's artifact of the same run and commit. The
  # checksums are over this archive alone until the arm64 one is attached.
  draft:
    needs: [x86-64-release, x86-64-suite, arm64-suite]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: archive-x86_64-unknown-linux-gnu
          path: dist
      - run: python3 scripts/release_ci.py checksums --target=x86_64-unknown-linux-gnu
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.tar.xz
      - run: python3 scripts/release_ci.py draft
        env:
          GH_TOKEN: ${{ github.token }}
