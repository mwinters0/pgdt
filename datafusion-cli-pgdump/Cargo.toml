[package]
name = "datafusion-cli-pgdump"
version.workspace = true
edition.workspace = true
# `src/lib.rs` is a copy of `datafusion-cli`'s `main.rs`, which is Apache-2.0,
# the licence every member takes.
license.workspace = true
publish.workspace = true

# `datafusion-cli` with the `pg_dump` provider built in: a copy of the upstream
# binary's private `main.rs` plus our registrations, re-copied at each
# DataFusion major, exported as a library whose `Args` and `run` a binary
# parses and calls -- `pgdt sql`, and any embedder wanting the CLI without
# `pgdt`. A library only: the one binary is `pgdt`. Its own crate, so an
# embedder of `datafusion-pgdump` does not inherit `datafusion-cli`, and named
# to sort beside it.

[features]
default = []
# The introspection build: what `pgdump_query::instrument` timed of a dynamic
# filter's row evaluation, a section of the report the calling binary writes
# on the way out to the file `PGDT_INTROSPECT_OUT` names (`src/pgdump.rs`,
# `introspection_section`); `pgdt`'s `introspect` turns it on. An
# instrument, never timed (`docs/design/roadmap.md`, "Attribution is
# introspective; only the gate is blind").
introspect = ["pgdump_query/introspect"]

[dependencies]
# Every version below is the targeted `datafusion-cli` release's own
# (`datafusion-cli/Cargo.toml` and its workspace's, 55.1.0), so the copied
# `main.rs` builds against what it was written for.
async-trait = "0.1.89"
clap = { version = "4.5.60", features = ["cargo", "derive"] }
datafusion = { version = "55.1.0", default-features = false }
datafusion-cli = "=55.1.0"
datafusion-common = { version = "55.1.0", default-features = false }
# `http` on, as `pgdt` turns it on: a dump is anything `pgdt --source` takes.
datafusion-pgdump = { path = "../datafusion-pgdump", features = ["http"] }
dirs = "6.0.0"
env_logger = "0.11"
# As a PID namespace's init, an `_exit` on every signal that ends the process
# elsewhere, bar a fault (`docs/design/decisions.md`, "D26"). Ours, not
# upstream's.
namespace-init = { path = "../namespace-init" }
pgdump_query = { path = "../pgdump_query" }
regex = "1.12"
tokio = { version = "1.52", features = ["macros", "rt", "rt-multi-thread", "sync"] }
