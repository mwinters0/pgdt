[package]
name = "peak-rss"
version.workspace = true
edition.workspace = true
publish = false

# The measurement harness's resident-set instrument: it runs a command and
# reports the command's peak resident set (`src/main.rs`). A workspace member
# so the round's checks build and test it with the rest and its `libc` is the
# lockfile's; `scripts/measure.py` builds it static, for
# `<machine>-unknown-linux-musl`, and mounts it into every figure's container,
# so it needs nothing of any image. Never shipped.

[dependencies]
# `getrusage` and `struct rusage`, whose layout is the target's rather than a
# hand-written one.
libc = "0.2.189"
