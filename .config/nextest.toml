# `cargo nextest run --workspace` runs the suite, one process a test; the
# doctests, which nextest cannot run, are `cargo test --workspace --doc`.
#
# A fixed cap rather than nextest's one thread a core: the fixture sweeps
# parallelise inside themselves, and the suite's wall is its longest sweep
# either way, so a cap costs little and leaves the machine to whatever runs
# beside it. The readings: `docs/status/history/2026-09-25.md`, "M154: nextest
# runs the suite".
[profile.default]
test-threads = 12
