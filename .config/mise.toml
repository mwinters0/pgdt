[tools]
# The development tools no build or check runs, kept out of `mise.toml` because
# the release image installs that file and refuses a tree whose copy differs
# from its own (`scripts/release.py`, `check_inside`): a bump here rebuilds no
# image. mise loads both files in a checkout.
node = "24.22.0"
npm = "12.2.1"

[env]
# `.config/bin/graft` stands in for the binary graft's own wiring names, so its
# directions hold as written; it runs `trail`, under the `node` pinned above.
_.path = ["{{config_root}}/.config/bin"]
