# Vendored, read-only. Generated by `scripts/vendor_xz_seek.py` from xz-seek's own Cargo.toml --
# do not hand-edit; re-run that script instead. A trimmed manifest:
# `[workspace]`, `[profile.dev]`, `[profile.profiling]` and
# `[dev-dependencies]` removed, since none of them resolve once this
# crate is dropped into another workspace.

[package]
name = "xz-seek"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "A positioned read over an .xz file: an uncompressed byte offset in, the bytes there out."
license = "MIT OR Apache-2.0"
publish = false

# Every dependency below but `crc` is optional, because two of this crate's
# three claims are about a crate being *absent*: the unsafe-free build is
# `--no-default-features --features xz4rust`, and what makes it unsafe-free is
# that `liblzma`, `crc32fast`, `crc64fast` and `sha2` are not in its graph.
# See `docs/design/architecture.md`, "Two implementations, selected by `cfg`
# rather than by resolution".
[features]
default     = ["liblzma", "fast-checks"]
liblzma     = ["dep:liblzma"]
xz4rust     = ["dep:xz4rust"]
fast-checks = ["dep:crc32fast", "dep:crc64fast", "dep:sha2"]
serde       = ["dep:serde"]

# The one `cfg` this crate reads that Cargo does not set. `--cfg
# xz_seek_decoder_reuse` compiles `F4`'s second arm — the block-payload seam
# reusing one `xz4rust` decoder across blocks instead of building one per block
# — and it is deliberately not a feature: features are additive and unify across
# a dependency graph, so a stray `xz-seek/...` anywhere would silently change
# every consumer's decode path for a measurement. Declared here so
# `unexpected_cfgs` stays on for everything else.
#
# See `docs/design/architecture.md`, "The decoder is built per block, and one
# `cfg` build reuses it".
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(xz_seek_decoder_reuse)'] }

[dependencies]
# Not optional, and not behind a feature: there is no `safe-checks`, so the safe
# path is selected by `cfg` inside `src/check.rs` rather than by resolution, and
# the `cfg` that compiles it includes `test` — which no Cargo feature can
# express. It costs the default build a compile and nothing in the binary: the
# tables are `const fn`-built inside generic items, so a build that never names
# `check::safe` monomorphizes none of them.
crc = "3.4"
crc32fast = { version = "1.5", optional = true }
crc64fast = { version = "1.1", optional = true }
liblzma = { version = "0.4.8", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
sha2 = { version = "0.10", optional = true }
# One configuration, for both builds: `sha256` is off because it is the one
# edge that would put `unsafe` back in the pure build, and the synthesized
# stream declares `check=None` so the backend never computes a check anyway;
# `crc64` is off for the same deadness. `no_unsafe` is free — see
# `docs/design/xz-invariants.md`, `I14`.
xz4rust = { version = "0.2", default-features = false, features = [
    "alloc",
    "std",
    "bcj",
    "delta",
    "no_unsafe",
], optional = true }

