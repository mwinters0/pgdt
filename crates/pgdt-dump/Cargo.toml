[package]
name = "pgdt-dump"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# What a crate above's tests reach that nothing else may: the cache's encoding,
# for the tests holding a save to it, and a line bound below `LINE_BOUND`, for
# the tests reading every path at both of its edges. `pgdt-mapping` and
# `pgdt-query` turn it on in their dev-dependencies.
[features]
test-support = []

[dependencies]
bincode = { workspace = true, features = ["serde"] }
bytes = { workspace = true }
futures = { workspace = true }
memchr = { workspace = true }
pgdt-core = { path = "../pgdt-core" }
# `serde` on for `cache::file::CompressionIndex`, which persists a
# `pgdt_io::SeekTable` in its `Xz` variant.
pgdt-io = { path = "../pgdt-io", features = ["serde"] }
pgdt-model = { path = "../pgdt-model" }
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["rt", "sync"] }
tracing = { workspace = true }

# A line past its chunk grows in a mapping of its own (`scan/chunked/line.rs`,
# `docs/design/decisions.md`, "D139"): `mremap` is Linux's.
[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }

[dev-dependencies]
# A gzip file to cache, written by an encoder not ours, and its index built in
# memory at a spacing the test states (`pgdt_io::internal::gzip_indexed_in_memory`).
flate2 = { workspace = true }
pgdt-io = { path = "../pgdt-io", features = ["serde", "test-support"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
