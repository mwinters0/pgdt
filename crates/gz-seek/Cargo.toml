[package]
name = "gz-seek"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Random access into gzip files: the addressing layer `pgdt-io`'s gzip adapter
# reads a `.gz` source through, as `xz-seek` is the `.xz` one's. A leaf — it
# depends on no workspace crate and names nothing of `pg_dump` — so that the
# split into its own repo is a move rather than a rewrite
# (`docs/design/decisions.md`, "D127").

# The inflater, one of three engines a feature names, each reached through its
# zlib-compatible C API, the one surface exposing what an index needs —
# `Z_BLOCK`'s boundary state, `inflatePrime` and the window read — and the
# engine's CRC-32 and `crc32_combine` beside them (`src/zlib.rs`). Exactly one
# is on, `src/zlib.rs` refusing any other count. A build naming another engine
# is a leg of the backend figure, built in a target dir of its own: `libz-sys`'s
# stock and zlib-ng builds exclude each other in one graph. The default is the
# engine that ships (`docs/design/decisions.md`, "D112").
[features]
default = ["zlib-rs"]
# zlib-rs, a Rust engine, through `libz-rs-sys`.
zlib-rs = ["dep:libz-rs-sys"]
# zlib-ng 2.3.3 in its zlib-compatible build, by CMake, through `libz-sys`:
# its `cc` build fails zlib-ng's function table at 1.1.30 and leaves AVX-512
# symbols undefined at 1.1.23, and a build given both modes builds stock zlib,
# which is why the harness asks each leg its engine.
zlib-ng = ["dep:libz-sys", "libz-sys/zlib-ng", "dep:libc"]
# Stock zlib, the copy `libz-sys` bundles, built by `cc` and linked statically.
zlib = ["dep:libz-sys", "libz-sys/stock-zlib", "libz-sys/static", "dep:libc"]

[dependencies]
# `calloc` and `free`, the allocator a `libz-sys` leg hands its stream, whose
# `z_stream` takes no null allocator.
libc = { workspace = true, optional = true }
# Each pinned exactly, so a build is the engine a figure read.
# upstream: UF4
libz-rs-sys = { version = "=0.6.8", optional = true }
# No default features: its default is stock zlib, which a zlib-ng build must
# leave off to be built at all.
libz-sys = { version = "=1.1.30", optional = true, default-features = false, features = ["libc"] }

[dev-dependencies]
# What the tests' members are written with: encoders not ours, so the decode
# is checked against what someone else's encoder writes.
flate2 = { workspace = true }
noodles-bgzf = { workspace = true }

[lints]
workspace = true
