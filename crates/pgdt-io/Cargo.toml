[package]
name = "pgdt-io"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
introspect = ["pgdt-core/introspect"]
# The remote source (`RemoteSource`) and everything that names a URL.
# **Default-off**: what `object_store`'s `http` feature drags in, an
# `aws-lc-sys` C build included, is too much to impose on an embedder that
# reads local files.
#
# `tokio/net` and `tokio/time` are declared here rather than inherited: the
# backend needs the IO and time drivers at runtime and nothing in its own tree
# turns them on, so a library built with this feature has a runtime that can
# drive it.
http = ["dep:object_store", "dep:url", "tokio/net", "tokio/time"]
# `SeekTable`'s persisted form, which `pgdt-dump`'s cache writes and reads:
# `xz_seek`'s own table's, unchanged.
serde = ["dep:serde", "xz-seek/serde"]

[dependencies]
bytes = { workspace = true }
futures = { workspace = true }
# `http` only, and `default-features = false` to leave out the `fs` backend:
# what is wanted is one `HttpStore` over ranged GETs. The `http` feature
# resolves to rustls over `aws-lc-rs`, whose `aws-lc-sys` is a C build by its
# `cc` builder; a version falling back to CMake is refused by
# `scripts/release.py build` (`docs/design/decisions.md`, "D111").
object_store = { version = "0.14.2", optional = true, default-features = false, features = [
    "http",
] }
pgdt-core = { path = "../pgdt-core" }
serde = { workspace = true, optional = true, features = ["derive"] }
tokio = { workspace = true, features = ["rt", "sync"] }
# The token a source races a request in flight against
# (`ByteRangeSource::hint_cancellation`).
tokio-util = { workspace = true }
# The facade only — no subscriber, no output policy. The library names the
# phases worth watching (the seek-table walk, the scan's start and
# completion); the CLI decides whether and how to render them
# (`docs/design/decisions.md`, "D67").
tracing = { workspace = true }
# `http` only: the same crate `object_store` parses URLs with, so a `Url` this
# crate builds is the one its backend takes. What reads it is
# `Origin::resolve`, which classifies a `--source` argument.
url = { version = "2.5.8", optional = true }
# `XzSource` constructs a seek table, walking the file's stream footers at
# open time.
xz-seek = { workspace = true }

[dev-dependencies]
# The `inflate-throughput` figure's deflate backends, which
# `examples/gzip_inflate.rs` drives directly, and the CRC-32 its `miniz_oxide`
# leg checks with. **Pinned exactly**: a backend's version is what that
# figure's row is a reading of, and `scripts/measure.py` declares this file.
crc32fast = "=1.5.1"
miniz_oxide = "=0.9.1"
zlib-rs = "=0.6.8"
# The gzip encoders `test_support` writes its single-member and BGZF payloads
# with, neither ours, so a reader is checked against what someone else's
# encoder writes; the lock pins each writer as `mise` pins a tool
# (`docs/design/roadmap-P15-gzip.md`, "Settled in the grilling").
flate2 = "1.1.10"
noodles-bgzf = "0.52.0"
# Where `pg_dump`'s own compressed fixtures are.
pgdt-fixtures = { path = "../pgdt-fixtures" }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
