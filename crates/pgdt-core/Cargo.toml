[package]
name = "pgdt-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The introspection build's hooks (`src/instrument/`): which allocations are
# statistics, and what a dynamic filter's row evaluation spends, for `pgdt`'s
# counting allocator and report. Every crate compiling a hook names its own
# `introspect`, turning this one on, since a `cfg` is read where the code is
# compiled; a build without it compiles every hook to nothing.
[features]
introspect = []

[dependencies]
# The date a refusal names; no features, as `pgdt-model`'s.
chrono = { workspace = true }
memchr = { workspace = true }
serde = { workspace = true, features = ["derive"] }
# SIMD UTF-8 validation, for the one bulk check a chunk of rows gets in place
# of one per field (`copy::validated_prefix`).
simdutf8 = "0.1.5"
thiserror = { workspace = true }
