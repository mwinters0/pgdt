[package]
name = "pgdump_query"
version.workspace = true
edition.workspace = true

[dependencies]
arrow = { version = "59.2.0", default-features = false }
async-stream = "0.3"
bincode = { version = "2", features = ["serde"] }
bytes = "1.12.1"
futures = "0.3.34"
memchr = "2.8.3"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt", "sync"] }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["async_tokio"] }
insta = "1.48.0"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }

[[bench]]
name = "decoders"
harness = false

[[bench]]
name = "whole_file"
harness = false
