[package]
name = "pgdump_query"
version.workspace = true
edition.workspace = true

[dependencies]
arrow = { version = "59.2.0", default-features = false }
# The same `arrow-schema` `arrow` itself depends on, named directly because
# `arrow::datatypes` re-exports the type list and not the `extension` module:
# `arrow.uuid`/`arrow.json` and the `supports_data_type` check that stamps
# them live there (see `pgtype::CanonicalExtension`).
arrow-schema = { version = "59.2.0", default-features = false, features = [
    "canonical_extension_types",
] }
async-stream = "0.3"
bincode = { version = "2", features = ["serde"] }
bytes = "1.12.1"
futures = "0.3.34"
memchr = "2.8.3"
serde = { version = "1.0.229", features = ["derive"] }
# SIMD UTF-8 validation, for the one bulk check a chunk of rows gets in place
# of one per field (`copy::validated_prefix`).
simdutf8 = "0.1.5"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt", "sync"] }
# A frozen, read-only vendored copy — `vendor/xz-seek` is excluded from this
# workspace, not published, and not yet used by any code here (D9,
# `docs/design/roadmap-P13-compressed-input.md`, "D9 — The dependency is a
# frozen vendored copy, not published, wired in by this phase"). The default
# features (`liblzma`, `fast-checks`) are the manifest's own and this phase's
# choice over `xz4rust` — see D9's "The build takes `liblzma`".
xz-seek = { path = "../vendor/xz-seek" }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["async_tokio"] }
insta = "1.48.0"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }

[[bench]]
name = "decoders"
harness = false

[[bench]]
name = "whole_file"
harness = false
