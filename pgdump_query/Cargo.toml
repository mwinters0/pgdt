[package]
name = "pgdump_query"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The facade over the `pgdt-*` crates while they are carved (`src/lib.rs`);
# each feature is the crates' own, passed through.
[features]
introspect = [
    "pgdt-core/introspect",
    "pgdt-model/introspect",
    "pgdt-io/introspect",
    "pgdt-query/introspect",
]
http = ["pgdt-io/http"]

[dependencies]
pgdt-codec = { path = "../crates/pgdt-codec" }
pgdt-core = { path = "../crates/pgdt-core" }
pgdt-dump = { path = "../crates/pgdt-dump" }
pgdt-io = { path = "../crates/pgdt-io" }
pgdt-model = { path = "../crates/pgdt-model" }
pgdt-query = { path = "../crates/pgdt-query" }

