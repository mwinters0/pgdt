[package]
name = "pgdt"
version.workspace = true
edition.workspace = true

# The allocator is the *binary's* choice, never the library's: a
# `#[global_allocator]` in `pgdump_query` would impose one on every embedder,
# which is precisely an embedding engine's position. See
# `docs/design/decisions.md`, "D13", and
# `docs/design/measurements.md`, "Which allocator a figure was taken under".
#
# mimalloc is the default and what ships; `system` and `jemalloc` are the
# measured legs of one figure rather than a supported matrix: `cd scripts &&
# uv run measure.py --figure allocator` builds the two with
# `--no-default-features --features <leg>` and times them against it. A build
# names exactly one allocator -- two, or none, is a compile error, not a
# precedence rule -- see `src/alloc.rs`.
[features]
default = ["mimalloc"]
jemalloc = ["dep:tikv-jemallocator"]
mimalloc = ["dep:mimalloc"]
system = []
# The introspection build (`src/introspect.rs`): a counting
# `#[global_allocator]` over mimalloc, with mimalloc's own statistics for the
# Rust heap and glibc's `mallinfo2` / `malloc_info` for what C allocates,
# printed as `key=value` lines on the way out. It is an *instrument*, not an
# allocator leg -- attribution asks the process, and only the gate stays
# black-box (`docs/design/roadmap.md`, "Attribution is introspective; only the
# gate is blind"). It never times anything, and `pgdt --version` names it so
# the harness cannot publish a figure taken on it. Its allocator is mimalloc,
# so it stands beside the default and is refused beside the other two. It
# turns on `datafusion-cli-pgdump`'s too, whose dynamic-filter timings an
# instrumented `pgdt sql` writes into the same report, a section of their own.
introspect = [
    "dep:libc",
    "dep:mimalloc",
    "dep:libmimalloc-sys",
    "pgdump_query/introspect",
    "datafusion-cli-pgdump/introspect",
]

[dependencies]
anyhow = "1.0.104"
arrow = { version = "59.2.0", default-features = false }
# `wrap_help`, not just `derive`: without it `clap` wraps help text at no width
# at all, so a flag whose doc comment is a paragraph prints as one line the
# terminal hard-wraps mid-word, losing the hanging indent an option list is read
# by. A flag's help *is* its doc comment here
# (`docs/design/decisions.md`, "D67"), so those paragraphs are the normal case rather than the
# exception. `tests/help_text.rs` snapshots every page so the rendering is
# reviewable at all.
clap = { version = "4.6.6", features = ["derive", "wrap_help"] }
# `pgdt sql`: DataFusion's own CLI, whose copied arguments are the
# subcommand's and whose entry point it calls. Unconditional, so the binary
# every figure times is the one a release ships (`docs/design/decisions.md`,
# "D13").
datafusion-cli-pgdump = { version = "0.1.0", path = "../datafusion-cli-pgdump" }
futures = "0.3.34"
# `introspect` only: `mallinfo2`, `malloc_info` and the `open_memstream` the
# second one writes into. A default build does not depend on it directly.
libc = { version = "0.2.189", optional = true }
# `introspect` only: `mi_stats_get_json` and `mi_free`, behind `extended`, as
# upstream DataFusion's benchmarks read mimalloc's statistics. The version is
# the one `mimalloc` itself links, so the two name one library.
libmimalloc-sys = { version = "0.1.49", optional = true, default-features = false, features = ["extended"] }
# The shipped allocator. No default features, as upstream's `datafusion-cli`
# links it: no `override`, so `liblzma` and `aws-lc` keep libc's `malloc` and
# the process has two heaps (`docs/design/decisions.md`, "D13").
mimalloc = { version = "0.1.50", optional = true, default-features = false }
# As its PID namespace's init, an `_exit` on every signal that ends the process
# elsewhere, bar a fault (`docs/design/decisions.md`, "D26").
namespace-init = { path = "../namespace-init" }
# `http` on: the remote source is the CLI's, and the oracle tests that judge it
# live in this crate, so `cargo test --workspace` runs them unconditionally
# rather than behind feature unification.
pgdump_query = { version = "0.1.0", path = "../pgdump_query", features = ["http"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
# No default features: `flag` and `low_level` are what `parse`'s handlers are
# built from -- the signal's number stored, the default action run on a
# second signal or one during the listing, and the re-raise that ends an
# interrupted run by its signal -- and a namespace init's `_exit` on the two it
# catches (`docs/design/decisions.md`, "D26"). Its
# registry is the one `tokio`'s `signal` already installs through, so these
# and the stream that cancels the scan run side by side. Rejected: `sigaction`
# and `raise` by hand, `unsafe` of this binary's own reimplementing them.
signal-hook = { version = "0.4.4", default-features = false }
tikv-jemallocator = { version = "0.6.0", optional = true }
# `rt`, not `rt-multi-thread`: `pgdt`'s own commands run a `current_thread`
# runtime and dispatch every unit of work through `spawn_blocking`, so the
# multi-threaded flavour would only buy reactor threads nothing runs on -- one
# per visible CPU, each seeding allocator state of its own before a byte is
# read. `sql` runs DataFusion's multi-threaded one, built inside
# `datafusion-cli-pgdump`, which brings the feature into the build; no other
# command starts one. See `commands` in `src/main.rs`, and
# `docs/design/decisions.md`, "D12".
# `net` and `time` beside them: the remote source's client needs the IO and
# time drivers, and this binary declares them rather than inheriting them by
# feature unification from a dependency that could stop enabling them.
tokio = { version = "1.53.1", features = ["rt", "macros", "signal", "net", "time"] }
tracing = "0.1"
# `fmt` for the subscriber itself; `time` for RFC3339 timestamps
# (`tracing_subscriber::fmt::time::UtcTime::rfc_3339`), the convention the
# koji orchestrator logs already use
# (`docs/design/decisions.md`, "D67"). No `ansi`: these lines are as likely to land
# in a redirected log file as a terminal.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "time"] }

[dev-dependencies]
# The one type `ByteRangeSource`'s signature names that the library does not
# re-export, and a unit test here implements that trait to pin what an omitted
# `--jobs` asks the source for (`ParallelArgs::resolve`). The version tracks
# `pgdump_query`'s own, since the two `Bytes` must be one type.
bytes = "1.12.1"
# `tests/help_text.rs` only. Same version as `pgdump_query`'s, so one
# `cargo insta review` covers both crates' snapshots.
insta = "1.48.0"
# `tests/namespace_init.rs` runs the binary as a PID namespace's init.
namespace-init = { path = "../namespace-init", features = ["test-support"] }
pgdump_query = { version = "0.1.0", path = "../pgdump_query", features = ["http"] }
tempfile = "3.27.0"
# `rt` here too, as the binary states it: every `#[tokio::test]` in this
# crate takes the default `current_thread` flavour, the one `pgdt`'s own
# commands run.
tokio = { version = "1.53.1", features = ["rt", "macros", "net", "time"] }
