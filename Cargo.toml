[workspace]
resolver = "2"
members = ["crates/*"]
# vendor/xz-seek is a frozen, read-only copy of an unpublished crate
# (docs/design/decisions.md, "The compressed source") -- excluded from the
# workspace, so it stays out of the shared lockfile and member list, but named
# as a path dependency below, for `pgdt-io` and `pgdt-dump`.
# `scripts/vendor_xz_seek.py` re-syncs it.
exclude = ["vendor/xz-seek"]

# The one place the version lives, and what `/release` moves
# (`.claude/skills/release/SKILL.md`); every member takes it, and a path
# dependency between members states no requirement, so a bump is this line.
# Every member is `Apache-2.0`, the licence DataFusion and Arrow carry and
# `datafusion-cli-pgdump`'s copy of `datafusion-cli`'s `main.rs` inherits, its
# text at the root's `LICENSE`; `vendor/xz-seek` keeps its own. Every member is
# unpublishable: a release is `pgdt`'s archives, never a crate
# (`docs/design/decisions.md`, "D104").
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# Every version more than one member names, stated once, and the Arrow crates
# beside `arrow`, which move with it; a member names it by `workspace = true`
# and adds the features it needs. Members' own path dependencies state no
# version and are not listed. Any other version only one member names stays in
# that member's manifest.
[workspace.dependencies]
# Arrow and DataFusion move together (`docs/design/roadmap.md`, "Arrow follows
# DataFusion"). No default features anywhere: a member turns on what it uses,
# and an embedder what it wants.
arrow = { version = "59.2.0", default-features = false }
# The same `arrow-buffer` and `arrow-schema` `arrow` itself depends on, named by
# `pgdt-codec`, which reaches Arrow's schema types and `i256` and nothing that
# builds an array (`docs/design/decisions.md`, "D74").
arrow-buffer = { version = "59.2.0", default-features = false }
arrow-schema = { version = "59.2.0", default-features = false }
async-trait = "0.1.89"
bincode = "2"
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false }
clap = "4.6.6"
criterion = "0.8.2"
datafusion = { version = "55.1.0", default-features = false }
futures = "0.3.34"
insta = "1.48.0"
libc = "0.2.189"
memchr = "2.8.3"
mimalloc = { version = "0.1.50", default-features = false }
serde = "1.0.229"
signal-hook = { version = "0.4.4", default-features = false }
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = "1.53.1"
tracing = "0.1"
# A frozen, read-only vendored copy — `vendor/xz-seek` is excluded from this
# workspace, not published (`docs/design/decisions.md`, "The compressed
# source"). The default features (`liblzma`, `fast-checks`) are the manifest's
# own, and are kept over `xz4rust` so that the integration being vetted is the
# one that ships.
xz-seek = { path = "vendor/xz-seek" }

# The test build optimizes, the workspace at 1 and its dependencies at 2: the
# fixture sweeps are CPU-bound in our own code, so optimizing dependencies alone
# leaves most of their cost, and `dev` keeps debug assertions and overflow
# checks at any level. `release`, `bench` and `profiling` do not inherit `dev`,
# so no figure moves. Rejected: tests under `--release`, which drops both
# checks; moving a sweep out of the default suite (`pruning.rs`'s own refusal).
# Reopens: an edit-to-test rebuild costing more than the sweeps save
# (`docs/status/history/2026-09-25.md`, "M152: the test build optimizes").
# Line tables only: a backtrace and a debugger still name the file and line,
# and the 66 test binaries every library change relinks stop carrying full
# debuginfo.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

# The shipped build: fat LTO in one codegen unit, `release-fat` below restated
# (`docs/design/decisions.md`, "D105").
[profile.release]
lto = "fat"
codegen-units = 1

# The profiling build. A sampling profile is how this project attributes scan
# cost per function rather than per subtraction (`docs/design/decisions.md`,
# "D25"), and
# a profile of a stock `release` binary is unreadable: no line tables, and
# `perf`'s frame-pointer unwinder walks into garbage the moment it leaves a
# leaf. This profile inherits `release` and adds only what the unwinder needs,
# so **`release` — what every published figure is taken with — is untouched**.
#
# Frame pointers are *not* here, because Cargo has no profile key for them:
# they come from `-C force-frame-pointers=yes` on the build line, which
# `cd scripts && uv run measure.py --profile-recipe` prints. A `RUSTFLAGS` build
# fingerprints separately, so `target/release/` survives a profiling build.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"

# The `release-profile` figure's three legs (`scripts/measure.py`,
# `PROFILE_LEGS`): what link-time optimization buys the shipped build, each
# timed beside the others from the tree being measured. Each inherits
# `release` and pins both of the two knobs the figure varies, so a leg stays
# the comparison it names whatever `release` comes to state; `release-fat` is
# the shipped build, and `release-default` Cargo's.
# `pgdt --version` names the profile a binary was built under
# (`crates/pgdt/build.rs`), which is how the harness asks a leg what it is.
[profile.release-default]
inherits = "release"
lto = false
codegen-units = 16

[profile.release-thin]
inherits = "release"
lto = "thin"
codegen-units = 16

[profile.release-fat]
inherits = "release"
lto = "fat"
codegen-units = 1
