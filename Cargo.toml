[workspace]
resolver = "2"
members = ["pgdump_query", "pgdump_query-cli"]
# vendor/xz-seek is a frozen, read-only copy of an unpublished crate
# (docs/design/decisions.md, "The compressed source") -- excluded from the
# workspace, so it stays out of the shared lockfile and member list, but named
# as a path dependency by pgdump_query itself.
# `scripts/vendor_xz_seek.py` re-syncs it.
exclude = ["vendor/xz-seek"]

[workspace.package]
version = "0.1.0"
edition = "2024"

# The profiling build. A sampling profile is how this project attributes scan
# cost per function rather than per subtraction (`docs/design/decisions.md`,
# "D25"), and
# a profile of a stock `release` binary is unreadable: no line tables, and
# `perf`'s frame-pointer unwinder walks into garbage the moment it leaves a
# leaf. This profile inherits `release` and adds only what the unwinder needs,
# so **`release` — what every published figure is taken with — is untouched**.
#
# Frame pointers are *not* here, because Cargo has no profile key for them:
# they come from `-C force-frame-pointers=yes` on the build line, which
# `cd scripts && uv run measure.py --profile-recipe` prints. A `RUSTFLAGS` build
# fingerprints separately, so `target/release/` survives a profiling build.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"
