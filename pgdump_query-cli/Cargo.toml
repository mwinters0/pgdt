[package]
name = "pgdump_query-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "pgdq"
path = "src/main.rs"

# The allocator is the *binary's* choice, never the library's: a
# `#[global_allocator]` in `pgdump_query` would impose one on every embedder,
# which is precisely P6's audience. See
# `docs/design/decisions.md`, "D13", and
# `docs/design/measurements.md`, "Which allocator a figure was taken under".
#
# Both features are measured legs of one figure rather than a supported
# matrix: `cd scripts && uv run measure.py --figure allocator` builds all
# three and times them. Enabling both at once is a compile error, not a
# precedence rule -- see `src/alloc.rs`.
[features]
default = []
jemalloc = ["dep:tikv-jemallocator"]
mimalloc = ["dep:mimalloc"]
# The introspection build (`src/introspect.rs`): a counting
# `#[global_allocator]` over `System` plus glibc's own `mallinfo2` /
# `malloc_info` statistics, printed as `key=value` lines on the way out. It is
# an *instrument*, not an allocator leg -- attribution asks the process, and
# only the gate stays black-box (`docs/design/roadmap.md`, "Attribution is
# introspective; only the gate is blind"). It never times anything, and
# `pgdq --version` names it so the harness cannot publish a figure taken on it.
introspect = ["dep:libc", "pgdump_query/introspect"]

[dependencies]
anyhow = "1.0.104"
arrow = { version = "59.2.0", default-features = false }
# `wrap_help`, not just `derive`: without it `clap` wraps help text at no width
# at all, so a flag whose doc comment is a paragraph prints as one line the
# terminal hard-wraps mid-word, losing the hanging indent an option list is read
# by. A flag's help *is* its doc comment here
# (`docs/design/decisions.md`, "D67"), so those paragraphs are the normal case rather than the
# exception. `tests/help_text.rs` snapshots every page so the rendering is
# reviewable at all.
clap = { version = "4.6.6", features = ["derive", "wrap_help"] }
futures = "0.3.34"
# `introspect` only: `mallinfo2`, `malloc_info` and the `open_memstream` the
# second one writes into. Nothing in a default build links it.
libc = { version = "0.2.189", optional = true }
mimalloc = { version = "0.1.50", optional = true }
# `http` on: the remote source is the CLI's, and the oracle tests that judge it
# live in this crate, so `cargo test --workspace` runs them unconditionally
# rather than behind feature unification.
pgdump_query = { version = "0.1.0", path = "../pgdump_query", features = ["http"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
tikv-jemallocator = { version = "0.6.0", optional = true }
# `rt`, not `rt-multi-thread`: the binary runs a `current_thread` runtime and
# dispatches every unit of work through `spawn_blocking`, so the multi-threaded
# flavour would only buy reactor threads nothing runs on -- one per visible CPU,
# each seeding a glibc arena before a byte is read. See `main`, and
# `docs/design/decisions.md`, "D12".
# `net` and `time` beside them: the remote source's client needs the IO and
# time drivers, and this binary declares them rather than inheriting them by
# feature unification from a dependency that could stop enabling them.
tokio = { version = "1.53.1", features = ["rt", "macros", "signal", "net", "time"] }
tracing = "0.1"
# `fmt` for the subscriber itself; `time` for RFC3339 timestamps
# (`tracing_subscriber::fmt::time::UtcTime::rfc_3339`), the convention the
# koji orchestrator logs already use
# (`docs/design/decisions.md`, "D67"). No `ansi`: these lines are as likely to land
# in a redirected log file as a terminal.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "time"] }

[dev-dependencies]
# The one type `ByteRangeSource`'s signature names that the library does not
# re-export, and a unit test here implements that trait to pin what an omitted
# `--jobs` asks the source for (`ParallelArgs::resolve`). The version tracks
# `pgdump_query`'s own, since the two `Bytes` must be one type.
bytes = "1.12.1"
# `tests/help_text.rs` only. Same version as `pgdump_query`'s, so one
# `cargo insta review` covers both crates' snapshots.
insta = "1.48.0"
pgdump_query = { version = "0.1.0", path = "../pgdump_query", features = ["http"] }
tempfile = "3.27.0"
# `rt` here too, and not only for symmetry: every `#[tokio::test]` in this
# crate takes the default `current_thread` flavour, and a dev-dependency
# naming `rt-multi-thread` would unify the feature back onto the binary
# whenever the test targets are built -- so `cargo test` would stop
# exercising the feature set the shipped binary is compiled with.
tokio = { version = "1.53.1", features = ["rt", "macros", "net", "time"] }
