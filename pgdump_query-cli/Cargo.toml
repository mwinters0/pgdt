[package]
name = "pgdump_query-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "pgdq"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
arrow = { version = "59.2.0", default-features = false }
clap = { version = "4.6.6", features = ["derive"] }
futures = "0.3.34"
pgdump_query = { version = "0.1.0", path = "../pgdump_query" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
