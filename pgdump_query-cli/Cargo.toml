[package]
name = "pgdump_query-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "pgdq"
path = "src/main.rs"

# The allocator is the *binary's* choice, never the library's: a
# `#[global_allocator]` in `pgdump_query` would impose one on every embedder,
# which is precisely P6's audience. See
# `docs/design/architecture.md`, "The allocator is the binary's choice", and
# `docs/design/measurements.md`, "Which allocator a figure was taken under".
#
# Both features are measured legs of one figure rather than a supported
# matrix: `cd scripts && uv run measure.py --figure allocator` builds all
# three and times them. Enabling both at once is a compile error, not a
# precedence rule -- see `src/alloc.rs`.
[features]
default = []
jemalloc = ["dep:tikv-jemallocator"]
mimalloc = ["dep:mimalloc"]

[dependencies]
anyhow = "1.0.104"
arrow = { version = "59.2.0", default-features = false }
clap = { version = "4.6.6", features = ["derive"] }
futures = "0.3.34"
mimalloc = { version = "0.1.50", optional = true }
pgdump_query = { version = "0.1.0", path = "../pgdump_query" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
tikv-jemallocator = { version = "0.6.0", optional = true }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal"] }
tracing = "0.1"
# `fmt` for the subscriber itself; `time` for RFC3339 timestamps
# (`tracing_subscriber::fmt::time::UtcTime::rfc_3339`), the convention the
# koji orchestrator logs already use
# (`docs/design/architecture.md`, "Status output"). No `ansi`: these lines are as likely to land
# in a redirected log file as a terminal.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "time"] }

[dev-dependencies]
pgdump_query = { version = "0.1.0", path = "../pgdump_query" }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
